name: GymApp
options:
  bundleIdPrefix: com.sorora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  GymApp:
    type: application
    platform: iOS
    sources:
      - GymApp
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: GymApp/Resources/GymApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
    info:
      path: GymApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: GymApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: "GymApp reads your workouts, heart rate, sleep, steps, body weight and nutrition (including data from Apple Watch, Polar and MyFitnessPal) to show everything in one place."
        NSHealthUpdateUsageDescription: "GymApp saves your strength workouts and body weight to Apple Health."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sorora.gymapp
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
